# Render reads `requires-python` from pyproject.toml and installs the latest
# Python that satisfies it. Pinning to 3.11.x because:
#   - Pyrogram 2.0.106 calls asyncio.get_event_loop() at import time, which
#     raises RuntimeError on Python 3.12+ (deprecated) and 3.14 (removed).
#   - tgcrypto 1.2.5 / aiohttp 3.9.5 / lxml 5.2.2 all have prebuilt wheels
#     for cpython 3.11 on linux-x86_64 (no compilation from source = faster
#     build on free tier).
#
# Result: Render installs Python 3.11.x and Pyrogram boots clean.

[project]
name = "telegram-video-bot"
version = "0.1.0"
description = "Telegram video downloader bot on Render free tier"
requires-python = ">=3.11,<3.12"
